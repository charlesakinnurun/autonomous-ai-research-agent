[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "autonomous-research-agent"
version = "0.1.0"
description = "Evidence-first autonomous research agent: plan, search, verify claims, and write cited reports."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "The Autonomous Research Agent Authors" }]
keywords = ["agents", "langgraph", "research", "rag", "evaluation", "dspy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Free-tier stack: a thin OpenAI-compatible router (Groq/Gemini/Ollama),
# self-hosted SearXNG, local fastembed, Postgres for state + vectors.
dependencies = [
    # API
    "fastapi>=0.162",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # Contracts
    "pydantic>=2.14",
    "pydantic-settings>=2.5",
    # Orchestration
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    # Storage
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary,pool]>=3.3.8",
    "alembic>=1.13",
    "pgvector>=0.5.1",
    # Tools / retrieval
    "httpx>=0.27",
    "trafilatura>=2.3.1",
    "pypdf>=5.0",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "fastembed>=0.9.1",
    # LLM + optimization (OpenAI-compatible client; no LiteLLM in v0.1)
    "openai>=1.50",
    "dspy>=3.4.1",
    "tiktoken>=0.8",
    # Observability
    "structlog>=24.4",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "freezegun>=1.5",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
    "ruff>=0.7",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
eval = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "ASYNC",
    "RUF",
    "S",   # bandit
    "PT",  # pytest style
]
ignore = ["S101"] # asserts are expected in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011", "PT018", "S603", "SLF001"]
"scripts/**" = ["S101", "T201"]
# Alembic autogenerate emits long, explicit column lines by design.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["research_agent"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# Runtime support is 3.11+, but the dev/CI interpreter is 3.12. numpy 2.5's
# bundled stubs use PEP 695 syntax, so checking at 3.11 cannot parse them.
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "dspy.*",
    "fastembed.*",
    "pgvector.*",
    "pypdf.*",
    "sse_starlette.*",
    "tiktoken.*",
    "trafilatura.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: pure unit tests; no network or database",
    "integration: requires Postgres and/or network",
    "contract: FastAPI request/response/SSE contracts",
    "eval: evaluation harness and replay tests",
    "smoke: installability and critical config presence",
    "live: hits real providers; never runs in CI",
    "slow: long-running; excluded from PR CI",
]

[tool.coverage.run]
branch = true
source = ["research_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
